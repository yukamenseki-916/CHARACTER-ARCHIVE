<title>CHARACTER CHAT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d120c;
  color: #e8dfc8;
  font-family: "Times New Roman","Yu Mincho","Hiragino Mincho ProN",serif;
}

.container {
  width: 92%;
  max-width: 760px;
  margin: 0 auto;
  padding: 30px 0 70px;
}

.header {
  text-align: center;
  padding: 30px 15px;
  border-top: 1px solid #a88b4a;
  border-bottom: 1px solid #a88b4a;
}

.archive-label {
  color: #99927f;
  font-size: 12px;
  letter-spacing: .25em;
}

.character-name {
  margin: 15px 0 8px;
  color: #d7b866;
  font-size: 36px;
  letter-spacing: .12em;
}

.character-job {
  color: #99927f;
  font-size: 12px;
  letter-spacing: .12em;
}

.character-area {
  margin-top: 30px;
  padding: 20px;
  border: 1px solid #625536;
  background: #111710;
  text-align: center;
}

.character-portrait {
  width: 100%;
  max-width: 430px;
  max-height: 560px;
  object-fit: contain;
  background: #090d08;
}

/* 親密度 */

.relationship-area {
  margin-top: 20px;
  padding: 15px 18px;
  border: 1px solid #4f4633;
  background: #111710;
}

.relationship-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.relationship-title {
  color: #a88b4a;
  font-size: 10px;
  letter-spacing: .15em;
}

.relationship-rank {
  color: #d7b866;
  font-size: 11px;
  letter-spacing: .12em;
}

.relationship-number {
  margin-top: 7px;
  color: #e8dfc8;
  font-size: 13px;
}

.relationship-bar {
  width: 100%;
  height: 4px;
  margin-top: 10px;
  background: #2a2d24;
  overflow: hidden;
}

.relationship-fill {
  width: 0%;
  height: 100%;
  background: #a88b4a;
  transition: width .4s ease;
}

/* 会話 */

.dialogue-area {
  margin-top: 25px;
}

.dialogue-box {
  min-height: 110px;
  padding: 22px;
  border: 1px solid #625536;
  background: #111710;
  color: #e8dfc8;
  line-height: 2;
  text-align: left;
  position: relative;
}

.dialogue-box::before {
  content: "MESSAGE";
  position: absolute;
  top: -9px;
  left: 15px;
  padding: 0 8px;
  background: #0d120c;
  color: #a88b4a;
  font-size: 9px;
  letter-spacing: .15em;
}

.dialogue-text {
  margin: 0;
  font-size: 15px;
}

/* ボタン */

.button-area {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.chat-button {
  flex: 1;
  max-width: 180px;
  padding: 13px 10px;
  border: 1px solid #77663f;
  background: #0d120c;
  color: #d7b866;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .12em;
  cursor: pointer;
}

.chat-button:hover {
  border-color: #d7b866;
  background: #151c13;
}

/* 質問 */

.question-area {
  display: none;
  margin-top: 20px;
}

.question-title {
  margin-bottom: 15px;
  color: #a88b4a;
  font-size: 11px;
  letter-spacing: .15em;
  text-align: center;
}

.question-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.question-button {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #4f4633;
  background: #111710;
  color: #d0c7b2;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
  transition: .2s;
}

.question-button:hover {
  color: #d7b866;
  border-color: #a88b4a;
  background: #151c13;
}

.question-back {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border: 1px solid #3f392b;
  background: transparent;
  color: #777261;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}

.question-back:hover {
  color: #d7b866;
  border-color: #77663f;
}

/* システム */

.system-message {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #3f392b;
  color: #777261;
  font-size: 10px;
  letter-spacing: .08em;
  text-align: center;
  line-height: 1.8;
}

.back {
  display: inline-block;
  margin: 25px 0 10px;
  color: #b9ad91;
  text-decoration: none;
  font-size: 13px;
}

.back:hover {
  color: #d7b866;
}

@media(max-width:600px) {

  .character-name {
    font-size: 30px;
  }

  .character-area {
    padding: 15px;
  }

  .character-portrait {
    max-height: 500px;
  }

  .button-area {
    gap: 8px;
  }

  .chat-button {
    padding: 12px 5px;
    font-size: 11px;
  }

}
</style>

/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const STORAGE_KEY =
  "characterChatDataV1";


function loadAllData() {

  try {

    return JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || {};

  } catch (error) {

    return {};

  }

}


function saveAllData(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function createDefaultData() {

  return {

    intimacy: 0,

    visits: 0,

    talks: 0,

    asks: 0,

    lastVisitDate: null,

    lastTalkDate: null,

    lastAskDate: null,

    dailyTalks: 0,

    dailyAsks: 0,

    discoveredSecrets: []

  };

}


function getCharacterData() {

  const allData =
    loadAllData();

  if (!allData[characterId]) {

    allData[characterId] =
      createDefaultData();

    saveAllData(allData);

  }

  return allData[characterId];

}


function saveCharacterData(data) {

  const allData =
    loadAllData();

  allData[characterId] =
    data;

  saveAllData(allData);

}


/* =========================================================
   DATE
   ========================================================= */

function getDateString(date = new Date()) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function getYesterdayString() {

  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate() - 1
  );

  return getDateString(yesterday);

}


function dateDifference(date1, date2) {

  const d1 =
    new Date(date1 + "T00:00:00");

  const d2 =
    new Date(date2 + "T00:00:00");

  return Math.round(
    (d2 - d1) /
    (1000 * 60 * 60 * 24)
  );

}


/* =========================================================
   INTIMACY
   ========================================================= */

function clampIntimacy(value) {

  return Math.max(
    0,
    Math.min(100, value)
  );

}


function getRank(value) {

  if (value >= 100)
    return "SPECIAL";

  if (value >= 90)
    return "TRUSTED";

  if (value >= 75)
    return "CLOSE";

  if (value >= 50)
    return "FRIEND";

  if (value >= 25)
    return "FAMILIAR";

  if (value >= 10)
    return "ACQUAINTANCE";

  return "UNKNOWN";

}


function updateRelationshipUI() {

  if (!character) return;

  const data =
    getCharacterData();

  relationshipNumber.textContent =
    data.intimacy;

  relationshipRank.textContent =
    getRank(data.intimacy);

  relationshipFill.style.width =
    data.intimacy + "%";

}


/* =========================================================
   VISIT
   ========================================================= */

function registerVisit() {

  if (!character) return;

  const data =
    getCharacterData();

  const today =
    getDateString();

  if (!data.lastVisitDate) {

    data.visits += 1;

    data.intimacy =
      clampIntimacy(
        data.intimacy + 2
      );

    data.lastVisitDate =
      today;

    saveCharacterData(data);

    systemMessage.textContent =
      "FIRST VISIT / RELATIONSHIP +2";

    updateRelationshipUI();

    return;

  }


  if (data.lastVisitDate === today) {

    updateRelationshipUI();

    return;

  }


  const difference =
    dateDifference(
      data.lastVisitDate,
      today
    );

  data.visits += 1;

  if (difference === 1) {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 3
      );

    systemMessage.textContent =
      "WELCOME BACK / RELATIONSHIP +3";

  } else {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 1
      );

    systemMessage.textContent =
      "VISIT RECORDED / RELATIONSHIP +1";

  }

  data.lastVisitDate =
    today;

  data.dailyTalks =
    0;

  data.dailyAsks =
    0;

  saveCharacterData(data);

  updateRelationshipUI();

}


/* =========================================================
   TALK
   ========================================================= */

let talkIndex = 0;


function talk() {

  if (!character) return;

  const data =
    getCharacterData();

  const today =
    getDateString();


  if (data.lastTalkDate !== today) {

    data.dailyTalks = 0;

    data.lastTalkDate =
      today;

  }


  if (data.dailyTalks < 5) {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 1
      );

    data.dailyTalks += 1;

  }


  data.talks += 1;


  const line =
    character.lines[
      talkIndex %
      character.lines.length
    ];

  talkIndex += 1;


  dialogueText.textContent =
    line;


  systemMessage.textContent =
    "TALK / " +
    character.file +
    " / RELATIONSHIP " +
    data.intimacy;


  saveCharacterData(data);

  updateRelationshipUI();

}

  questionArea.style.display =

/* =========================================================
   QUESTIONS
   ========================================================= */

function renderQuestions() {

  questionList.innerHTML = "";

  character.questions.forEach(
    (item, index) => {

      const button =
        document.createElement("button");

      button.className =
        "question-button";

      button.textContent =
        item.question;

      button.addEventListener(
        "click",
        () => {

          answerQuestion(
            item,
            index
          );

        }
      );

      questionList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   ANSWER QUESTION
   ========================================================= */

function answerQuestion(item, index) {

  const data =
    getCharacterData();

  const today =
    getDateString();


  if (data.lastAskDate !== today) {

    data.dailyAsks = 0;

    data.lastAskDate =
      today;

  }


  if (data.dailyAsks < 5) {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 1
      );

    data.dailyAsks += 1;

  }


  data.asks += 1;


  dialogueText.textContent =
    item.answer;


  systemMessage.textContent =
    "ANSWER " +
    String(index + 1).padStart(2, "0") +
    " / RELATIONSHIP " +
    data.intimacy;


  saveCharacterData(data);

  updateRelationshipUI();


  /*
   * 質問を選んだあとも、
   * 別の質問を選べるようにする。
   */

  questionArea.style.display =
    "block";

  mainButtons.style.display =
    "none";

}

function closeQuestions() {

  mainButtons.style.display =

/* =========================================================
   SPECIAL CONVERSATION
   ========================================================= */

function hasDiscoveredSecret(data, id) {

  if (!data.discoveredSecrets) {

    data.discoveredSecrets = [];

  }

  return data.discoveredSecrets.includes(id);

}


/* ---------------------------------------------------------
   発生可能な特殊会話を探す
   --------------------------------------------------------- */

function findSpecialConversation(data) {

  if (!character) return null;

  const list =
    specialConversations[characterId];

  if (!list) return null;

  const now =
    new Date();

  for (const event of list) {

    /*
     * 一度見た特殊会話は再発生させない
     */

    if (
      hasDiscoveredSecret(
        data,
        event.id
      )
    ) {

      continue;

    }


    /*
     * 条件を満たしているか確認
     */

    let available =
      false;

    try {

      available =
        event.condition(
          data,
          now
        );

    } catch (error) {

      available =
        false;

    }


    if (available) {

      return event;

    }

  }

  return null;

}


/* ---------------------------------------------------------
   特殊会話を発生させる
   --------------------------------------------------------- */

function triggerSpecialConversation(event, data) {

  if (!event) return false;

  if (!data.discoveredSecrets) {

    data.discoveredSecrets = [];

  }


  /*
   * 発見済みとして記録
   */

  data.discoveredSecrets.push(
    event.id
  );


  /*
   * 会話表示
   */

  dialogueText.textContent =
    event.message;


  /*
   * システム表示
   */

  systemMessage.textContent =
    event.system ||
    "SPECIAL EVENT / UNLOCKED";


  saveCharacterData(data);

  updateRelationshipUI();


  return true;

}

   ========================================================= */


function talk() {

  if (!character) return;

  const data =
    getCharacterData();

  const today =
    getDateString();


  /*
   * 今日のTALK回数を初期化
   */

  if (
    data.lastTalkDate !== today
  ) {

    data.dailyTalks = 0;

    data.lastTalkDate =
      today;

  }


  /*
   * 親密度上昇
   *
   * 1日に5回まで
   */

  if (
    data.dailyTalks < 5
  ) {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 1
      );

    data.dailyTalks += 1;

  }


  data.talks += 1;


  /*
   * まず特殊会話を確認
   *
   * 通常会話より特殊会話を優先する。
   */

  const specialEvent =
    findSpecialConversation(data);


  if (
    specialEvent
  ) {

    triggerSpecialConversation(
      specialEvent,
      data
    );

    return;

  }


  /*
   * 特殊会話がなければ通常会話
   */

  const line =
    character.lines[
      talkIndex %
      character.lines.length
    ];

  talkIndex += 1;


  dialogueText.textContent =
    line;


  systemMessage.textContent =
    "TALK / " +
    character.file +
    " / RELATIONSHIP " +
    data.intimacy;


  saveCharacterData(data);

  updateRelationshipUI();

}

  questionArea.style.display =
    "block";

  dialogueText.textContent =
    character.askMessage;

  systemMessage.textContent =
    "QUESTION SYSTEM / SELECT A QUESTION";

  renderQuestions();

}


/* =========================================================
   QUESTIONS
   ========================================================= */

function renderQuestions() {

  questionList.innerHTML = "";

  character.questions.forEach(
    (item, index) => {

      const button =
        document.createElement("button");

      button.className =
        "question-button";

      button.textContent =
        item.question;

      button.addEventListener(
        "click",
        () => {

          answerQuestion(
            item,
            index
          );

        }
      );

      questionList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   ANSWER QUESTION
   ========================================================= */

function answerQuestion(item, index) {

  const data =
    getCharacterData();

  const today =
    getDateString();


  /*
   * 今日のASK回数を初期化
   */

  if (
    data.lastAskDate !== today
  ) {

    data.dailyAsks = 0;

    data.lastAskDate =
      today;

  }


  /*
   * 1日に5回まで親密度上昇
   */

  if (
    data.dailyAsks < 5
  ) {

    data.intimacy =
      clampIntimacy(
        data.intimacy + 1
      );

    data.dailyAsks += 1;

  }


  data.asks += 1;


  /*
   * 回答表示
   */

  dialogueText.textContent =
    item.answer;


  systemMessage.textContent =
    "ANSWER " +
    String(index + 1)
      .padStart(2, "0") +
    " / RELATIONSHIP " +
    data.intimacy;


  saveCharacterData(data);

  updateRelationshipUI();


  /*
   * 質問を選んだあとも、
   * 別の質問を選べるようにする。
   */

  questionArea.style.display =
    "block";

  mainButtons.style.display =
    "none";

}


/* =========================================================
   QUESTION BACK
   ========================================================= */

function closeQuestions() {

  questionArea.style.display =
    "none";

  mainButtons.style.display =
    "flex";

  dialogueText.textContent =
    character.askMessage;

  systemMessage.textContent =
    "QUESTION SYSTEM / READY";

}


/* =========================================================
   EVENTS
   ========================================================= */

talkButton.addEventListener(
  "click",
  talk
);


askButton.addEventListener(
  "click",
  openQuestions
);


questionBack.addEventListener(
  "click",
  closeQuestions
);


/* =========================================================
   INITIALIZE
   ========================================================= */

if (character) {

  registerVisit();

  dialogueText.textContent =
    character.lines[0];

  updateRelationshipUI();

}

</script>

</body>
</html>
