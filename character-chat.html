* {

body {

}

.container {
  width: 92%;
  max-width: 760px;
  margin: 0 auto;
  padding: 30px 0 70px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 30px 15px;
  border-top: 1px solid #a88b4a;
  border-bottom: 1px solid #a88b4a;
}

.archive-label {
  color: #99927f;
  font-size: 12px;
  letter-spacing: .25em;
}

.character-name {
  margin: 15px 0 8px;
  color: #d7b866;
  font-size: 36px;
  letter-spacing: .12em;
}

.character-job {
  color: #99927f;
  font-size: 12px;
  letter-spacing: .12em;
}

/* PORTRAIT */

.character-area {
  margin-top: 30px;
  padding: 20px;
  border: 1px solid #625536;
  background: #111710;
  text-align: center;
}

.character-portrait {
  width: 100%;
  max-width: 430px;
  max-height: 560px;
  object-fit: contain;
  background: #090d08;
}

/* DIALOGUE */

.dialogue-area {
  margin-top: 25px;
}

.dialogue-box {
  min-height: 110px;
  padding: 22px;
  border: 1px solid #625536;
  background: #111710;
  color: #e8dfc8;
  line-height: 2;
  text-align: left;
  position: relative;
}

.dialogue-box::before {
  content: "MESSAGE";
  position: absolute;
  top: -9px;
  left: 15px;
  padding: 0 8px;
  background: #0d120c;
  color: #a88b4a;
  font-size: 9px;
  letter-spacing: .15em;
}

.dialogue-text {
  margin: 0;
  font-size: 15px;
}

/* BUTTONS */

.button-area {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.chat-button {
  flex: 1;
  max-width: 180px;
  padding: 13px 10px;
  border: 1px solid #77663f;
  background: #0d120c;
  color: #d7b866;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .12em;
  cursor: pointer;
}

.chat-button:hover {
  border-color: #d7b866;
  background: #151c13;
}

/* SYSTEM */

.system-message {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #3f392b;
  color: #777261;
  font-size: 10px;
  letter-spacing: .08em;
  text-align: center;
  line-height: 1.8;
}

/* BACK */

.back {
  display: inline-block;
  margin: 25px 0 10px;
  color: #b9ad91;
  text-decoration: none;
  font-size: 13px;
}

.back:hover {
  color: #d7b866;
}

@media (max-width: 600px) {

  .character-name {
    font-size: 30px;
  }

  .character-area {
    padding: 15px;
  }

  .character-portrait {
    max-height: 500px;
  }

  .button-area {
    gap: 8px;
  }

  .chat-button {
    padding: 12px 5px;
    font-size: 11px;
  }
}
</style>

/* =========================================
   CHARACTER SELECT
========================================= */

const params = new URLSearchParams(location.search);
const characterId = params.get("character");

const character = characters[characterId];

const fileNumber = document.getElementById("fileNumber");
const characterName = document.getElementById("characterName");
const characterJob = document.getElementById("characterJob");
const characterImage = document.getElementById("characterImage");
const dialogueText = document.getElementById("dialogueText");
const systemMessage = document.getElementById("systemMessage");

const talkButton = document.getElementById("talkButton");
const askButton = document.getElementById("askButton");


/* =========================================
   CHARACTER NOT FOUND
========================================= */

if (!character) {

  fileNumber.textContent = "CHARACTER ARCHIVE / ERROR";
  characterName.textContent = "CHARACTER NOT FOUND";
  characterJob.textContent = "";
  characterImage.style.display = "none";

  dialogueText.textContent =
    "指定されたキャラクターが見つかりません。";

  systemMessage.textContent =
    "CHARACTER CHAT SYSTEM / ERROR";

  talkButton.style.display = "none";
  askButton.style.display = "none";

}


/* =========================================
   LOAD CHARACTER
========================================= */

if (character) {

  fileNumber.textContent =
    "CHARACTER ARCHIVE / " + character.file;

  characterName.textContent =
    character.name;

  characterJob.textContent =
    character.job;

  characterImage.src =
    character.image;

  characterImage.alt =
    character.name;

  let lineIndex = 0;

  dialogueText.textContent =
    character.lines[lineIndex];


  /* TALK */

  talkButton.addEventListener("click", function() {

    lineIndex++;

    if (lineIndex >= character.lines.length) {
      lineIndex = 0;
    }

    dialogueText.textContent =
      character.lines[lineIndex];

    systemMessage.textContent =
      "CHARACTER CHAT SYSTEM / TALK";

  });


  /* ASK */

  askButton.addEventListener("click", function() {

    dialogueText.textContent =
      "……何を聞きたいの？";

    systemMessage.textContent =
      "QUESTION SYSTEM / COMING SOON";

  });

}

</script>

<script src="menu.js"></script>
