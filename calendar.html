<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;

  background: #0d120c;

  color: #e8dfc8;

  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
}


.container {

  width: 92%;

  max-width: 1000px;

  margin: 0 auto;

  padding: 40px 0 70px;

}


/* =========================
   HEADER
========================= */

.header {

  text-align: center;

  padding: 35px 15px 30px;

  border-top: 1px solid #a88b4a;

  border-bottom: 1px solid #a88b4a;

}


.archive-label {

  color: #99927f;

  font-size: 12px;

  letter-spacing: 0.25em;

}


.page-title {

  margin: 15px 0 8px;

  color: #d7b866;

  font-size: 38px;

  letter-spacing: 0.15em;

}


.page-subtitle {

  color: #99927f;

  font-size: 13px;

  letter-spacing: 0.2em;

}


/* =========================
   BACK
========================= */

.back {

  display: inline-block;

  margin: 25px 0 10px;

  color: #b9ad91;

  text-decoration: none;

  font-size: 13px;

}


.back:hover {

  color: #d7b866;

}


/* =========================
   CALENDAR
========================= */

.calendar-section {

  margin-top: 35px;

}


.calendar-navigation {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 20px;

}


.month-title {

  margin: 0;

  color: #d7b866;

  font-size: 24px;

  letter-spacing: 0.12em;

}


.month-button {

  width: 42px;

  height: 42px;

  border: 1px solid #77663f;

  background: #111710;

  color: #b9ad91;

  font-family: inherit;

  font-size: 18px;

  cursor: pointer;

}


.month-button:hover {

  color: #d7b866;

  border-color: #d7b866;

}


/* =========================
   CALENDAR GRID
========================= */

.calendar {

  border: 1px solid #625536;

  background: #111710;

}


.weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  border-bottom: 1px solid #625536;

}


.weekday {

  padding: 12px 5px;

  text-align: center;

  color: #a88b4a;

  font-size: 11px;

  letter-spacing: 0.08em;

}


.days {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

}


.day {

  min-height: 115px;

  padding: 9px;

  border-right: 1px solid #3f392b;

  border-bottom: 1px solid #3f392b;

}


.day:nth-child(7n) {

  border-right: none;

}


.day-number {

  color: #99927f;

  font-size: 12px;

}


.empty-day {

  background: #0d120c;

}


.today {

  box-shadow:
    inset 0 0 0 1px #a88b4a;

}


/* =========================
   BIRTHDAY
========================= */

.birthday-list {

  margin-top: 7px;

}


.birthday-link {

  display: block;

  margin-top: 6px;

  padding: 5px 6px;

  border-left: 2px solid #a88b4a;

  background: #151b13;

  color: #d7b866;

  text-decoration: none;

  font-size: 11px;

  line-height: 1.5;

}


.birthday-link:hover {

  color: #fff0b8;

  background: #1a2117;

}


/* =========================
   INFORMATION
========================= */

.info-section {

  margin-top: 45px;

}


.section-title {

  margin: 0;

  color: #d7b866;

  font-size: 22px;

  letter-spacing: 0.12em;

}


.section-title::after {

  content: "";

  display: block;

  width: 60px;

  height: 1px;

  background: #a88b4a;

  margin-top: 10px;

}


.birthday-summary {

  margin-top: 20px;

  padding: 20px;

  border: 1px solid #625536;

  background: #111710;

}


.birthday-summary p {

  margin: 0;

  color: #b9ad91;

  font-size: 13px;

  line-height: 1.8;

}


/* =========================
   FOOTER
========================= */

.footer {

  margin-top: 60px;

  padding-top: 20px;

  border-top: 1px solid #4f4633;

  text-align: center;

  color: #777261;

  font-size: 11px;

  letter-spacing: 0.1em;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .container {

    width: 92%;

    padding-top: 25px;

  }


  .page-title {

    font-size: 30px;

  }


  .calendar-navigation {

    margin-bottom: 15px;

  }


  .month-title {

    font-size: 20px;

  }


  .month-button {

    width: 38px;

    height: 38px;

  }


  .day {

    min-height: 80px;

    padding: 5px;

  }


  .weekday {

    padding: 9px 2px;

    font-size: 9px;

  }


  .day-number {

    font-size: 10px;

  }


  .birthday-link {

    margin-top: 4px;

    padding: 4px;

    font-size: 9px;

  }

}

/* =========================
   BIRTHDAY RECORD
========================= */

.birthday-record-list {
  margin-top: 20px;
}

.birthday-record-item {
  padding: 16px 0;
  border-bottom: 1px solid #3f392b;
}

.birthday-record-item:last-child {
  border-bottom: none;
}

.birthday-record-name {
  display: block;
  color: #d0c7b2;
  text-decoration: none;
  font-size: 14px;
  line-height: 1.8;
}

.birthday-record-name:hover {
  color: #d7b866;
}

.birthday-record-reason {
  margin-top: 3px;
  color: #777261;
  font-size: 11px;
  line-height: 1.7;
  letter-spacing: 0.05em;
}

.no-birthday {
  margin: 0;
  color: #777261;
  font-size: 13px;
}
  
</style>


<script src="menu.js" defer></script>

</head>

/* =========================
   CALENDAR
========================= */

let currentDate = new Date();


const monthTitle =
  document.getElementById("monthTitle");

const calendarDays =
  document.getElementById("calendarDays");


function renderCalendar() {


  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  const monthNumber =
    month + 1;


  monthTitle.textContent =
    year + " / " +
    String(monthNumber).padStart(2, "0");


  calendarDays.innerHTML = "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const lastDate =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const today =
    new Date();


  /* 空白 */

  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

    const empty =
      document.createElement("div");

    empty.className =
      "day empty-day";

    calendarDays.appendChild(empty);

  }


  /* 日付 */

  for (
    let date = 1;
    date <= lastDate;
    date++
  ) {


    const day =
      document.createElement("div");

    day.className =
      "day";


    /* 今日 */

    if (
      year === today.getFullYear() &&
      month === today.getMonth() &&
      date === today.getDate()
    ) {

      day.classList.add("today");

    }


    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent =
      date;


    day.appendChild(number);


    /* 誕生日 */

    const monthBirthdays =
      birthdays[monthNumber] || [];


    const todayBirthdays =
      monthBirthdays.filter(
        function (birthday) {

          return birthday.day === date;

        }
      );


    if (
      todayBirthdays.length > 0
    ) {


      const list =
        document.createElement("div");

      list.className =
        "birthday-list";


      todayBirthdays.forEach(
        function (birthday) {


          const link =
            document.createElement("a");

          link.className =
            "birthday-link";

          link.href =
            birthday.url;

          link.textContent =
            birthday.name;


          list.appendChild(link);

        }
      );


      day.appendChild(list);

    }


    calendarDays.appendChild(day);

  }

}


/* =========================
   MONTH BUTTONS
========================= */

document
  .getElementById("prevMonth")
  .addEventListener(
    "click",
    function () {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();
      renderBirthdayRecord();

    }
  );


document
  .getElementById("nextMonth")
  .addEventListener(
    "click",
    function () {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();
      renderBirthdayRecord();

    }
  );


/* =========================
   BIRTHDAY RECORD
========================= */

function renderBirthdayRecord() {

  const recordList =
    document.getElementById("birthdayRecordList");

  const monthNumber =
    currentDate.getMonth() + 1;

  const monthBirthdays =
    birthdays[monthNumber] || [];


  if (monthBirthdays.length === 0) {

    recordList.innerHTML = `
      <p class="no-birthday">
        この月に登録された誕生日はありません。
      </p>
    `;

    return;
  }


  recordList.innerHTML =
    monthBirthdays.map(
      function (birthday) {

        return `
          <div class="birthday-record-item">

            <a
              href="${birthday.url}"
              class="birthday-record-name"
            >
              ${monthNumber}月${birthday.day}日　${birthday.name}
            </a>

            ${
              birthday.reason
                ? `
                  <div class="birthday-record-reason">
                    ${birthday.reason}
                  </div>
                `
                : ""
            }

          </div>
        `;

      }
    ).join("");

}
