<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>月下 香 | CHARACTER FILE</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d120c;
  color: #e8dfc8;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
}

.container {
  width: 92%;
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 0 70px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 30px 15px;
  border-top: 1px solid #a88b4a;
  border-bottom: 1px solid #a88b4a;
}

.archive-label {
  color: #99927f;
  font-size: 12px;
  letter-spacing: 0.25em;
}

.character-name {
  margin: 15px 0 8px;
  color: #d7b866;
  font-size: 38px;
  letter-spacing: 0.12em;
}

.character-name-kana {
  color: #99927f;
  font-size: 13px;
}

/* BACK */

.back {
  display: inline-block;
  margin: 25px 0 10px;
  color: #b9ad91;
  text-decoration: none;
  font-size: 13px;
}

.back:hover {
  color: #d7b866;
}

/* PORTRAIT */

.portrait-area {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid #625536;
  background: #111710;
  text-align: center;
}

.portrait {
  width: 100%;
  max-width: 500px;
  max-height: 650px;
  object-fit: contain;
  background: #090d08;
}

/* DIFFERENCE BUTTON */

.portrait-buttons {
  margin-top: 18px;
}

.portrait-button {
  padding: 9px 18px;
  margin: 4px;
  border: 1px solid #77663f;
  background: #0d120c;
  color: #b9ad91;
  font-family: inherit;
  cursor: pointer;
}

.portrait-button:hover {
  color: #d7b866;
  border-color: #d7b866;
}

/* SECTION */

.section {
  margin-top: 35px;
}

.section-title {
  margin: 0;
  color: #d7b866;
  font-size: 22px;
  letter-spacing: 0.12em;
}

.section-title::after {
  content: "";
  display: block;
  width: 60px;
  height: 1px;
  background: #a88b4a;
  margin-top: 10px;
}

/* DATA */

.data-box {
  margin-top: 20px;
  border: 1px solid #625536;
  background: #111710;
}

.data-row {
  display: flex;
  border-bottom: 1px solid #3f392b;
}

.data-row:last-child {
  border-bottom: none;
}

.data-label {
  width: 38%;
  padding: 13px;
  color: #a88b4a;
  font-size: 12px;
  letter-spacing: 0.1em;
  border-right: 1px solid #3f392b;
}

.data-value {
  width: 62%;
  padding: 13px;
  color: #e8dfc8;
}

/* PROFILE */

.profile-box {
  margin-top: 20px;
  padding: 22px;
  border: 1px solid #625536;
  background: #111710;
  line-height: 2;
  font-size: 14px;
}

.quote {
  margin: 0 0 20px;
  padding: 15px;
  border-left: 2px solid #a88b4a;
  color: #d7b866;
  font-size: 15px;
  line-height: 1.9;
}

/* SCENARIO */

.scenario-list {
  margin-top: 20px;
  padding: 0;
  list-style: none;
}

.scenario-list li {
  margin-bottom: 10px;
  padding: 13px 15px;
  border: 1px solid #4f4633;
  background: #111710;
  color: #d0c7b2;
}

/* FOOTER */

.footer {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 1px solid #4f4633;
  text-align: center;
  color: #777261;
  font-size: 11px;
  letter-spacing: 0.1em;
}

/* MOBILE */

@media (max-width: 600px) {

  .character-name {
    font-size: 30px;
  }

  .portrait {
    max-height: 560px;
  }

  .data-label {
    width: 40%;
  }

  .data-value {
    width: 60%;
  }

}

</style>
</head>
